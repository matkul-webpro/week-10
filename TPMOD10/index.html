<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Modul 10 - AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="card border-0 shadow-sm mx-auto form-card">
            <div class="card-body p-4">
                <h1 class="h5 mb-4">Form AJAX</h1>

                <div class="mb-3">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" id="nama" class="form-control" placeholder="Masukkan nama Anda">
                </div>

                <button type="button" id="kirim" class="btn btn-primary w-100">Kirim</button>

                <div id="response" class="alert alert-secondary mt-3 mb-0">
                    Response dari server akan tampil di sini.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const inputNama = document.getElementById('nama');
        const tombolKirim = document.getElementById('kirim');
        const areaResponse = document.getElementById('response');

        tombolKirim.addEventListener('click', function () {
            const nama = inputNama.value;
            areaResponse.className = 'alert alert-secondary mt-3 mb-0';
            areaResponse.textContent = 'Memuat...';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'server.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        areaResponse.textContent = xhr.responseText;
                        areaResponse.className = 'alert alert-success mt-3 mb-0';
                    } else if (xhr.status === 400) {
                        areaResponse.textContent = xhr.responseText;
                        areaResponse.className = 'alert alert-danger mt-3 mb-0';
                    } else {
                        areaResponse.textContent = 'Terjadi kesalahan pada server.';
                        areaResponse.className = 'alert alert-danger mt-3 mb-0';
                    }
                }
            };

            xhr.send('nama=' + encodeURIComponent(nama));
        });
    </script>
</body>
</html>
